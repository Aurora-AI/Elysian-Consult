    - "Gabarito: 'SVC · Serviço mascara produto (L7): serviços almofadam o total, mas a margem de PRODUTO segue ~-R$4k'"
    - "Gabarito: 'Serviço não tem estoque → não entra em GMROI; não deve poluir ticket médio de produto'"
  impacto: "O mecanismo central do Ato 2 do laudo (o paradoxo L7) não é detectável pela fórmula documentada."
