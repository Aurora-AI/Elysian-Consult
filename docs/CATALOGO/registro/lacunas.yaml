- id: LAC-FOR-043
  tipo: LAC
  severidade: ALTA
  titulo: "Ponto de Equilíbrio indefinido quando a margem é nula ou negativa"
  evidencia: ["F1 §6.5 e §6.6: PE = CF ÷ (MC% ÷ 100)"]
  impacto: "Nas lojas que mais precisam do indicador (L7, L9 do Gabarito, com margem negativa) o PE explode ou inverte de sinal."
  correcao_candidata: "Comportamento declarado: 'sem ponto de equilíbrio no mix atual' em vez de número."
  bloqueia: [FOR-MRG-015, FOR-MRG-019]
  quem_decide: Rodrigo
  status: RESOLVIDA
  resolvida_por: DEC-008
  resolvida_em: 2026-08-13
  regra_criada: REG-NUM-004
  resolucao: >
    PE com MC% ≤ 0 → "sem ponto de equilíbrio no mix atual". Não existe PE, e é exatamente isso que precisa ser dito ao dono.

