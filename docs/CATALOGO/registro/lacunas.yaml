  bloqueia: [FOR-MRG-013]
  quem_decide: Rodrigo
  status: ABERTA

- id: LAC-FOR-042
  tipo: LAC
  severidade: ALTA
  titulo: "MC não decompõe serviço × produto — e o Gabarito exige"
  evidencia:
