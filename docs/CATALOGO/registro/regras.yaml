- id: REG-NUM-005
  tipo: REG
  bloco: NUM
  nome: "Composição parcial → renormaliza sobre o disponível e declara"
  resumo: "Índice composto com parcela faltando renormaliza, marca 'parcial' e lista o que faltou. Com pouco demais, não publica."
  gatilho: "índice composto (SEV, AGV, NC) com uma ou mais parcelas sem dado"
  acao: >
    Renormalizar os pesos sobre as parcelas DISPONÍVEIS (Σp dos presentes = 1) e publicar com
    selo 'parcial' + a lista do que faltou.
    NUNCA preencher a parcela ausente com 0 — que pune quem não tem o dado.
    NUNCA preencher com a média — que inventa desempenho.
    PISO DE PUBLICAÇÃO: se menos de 60% do peso original estiver disponível, o composto NÃO é
    publicado — cai em REG-NUM-001 (nulo com selo). Meio índice não é um índice.
