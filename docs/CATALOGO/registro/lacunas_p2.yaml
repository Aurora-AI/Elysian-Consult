- id: LAC-NUM-090
  tipo: LAC
  severidade: ALTA
  titulo: "As fórmulas estatísticas nunca foram observadas em regime"
  descricao: >
    Confirmado pelo autor (13/08): as planilhas de teste foram feitas para testar o SISTEMA —
    erros calculados, cenários caóticos — e nunca houve teste de escala. Elas validam
    DETECÇÃO (achou a anomalia plantada? ignorou o falso positivo? aguentou o dado sujo?),
    que é o que 37 casos de gabarito fazem bem.
    O que fixture caótica não alcança é ESTABILIDADE. E boa parte do arsenal é estatística
    pura: P75, mediana, quintil, desvio-padrão, amplitude, máximo sustentado, Pareto.
    Nenhuma dessas foi observada num regime onde fosse estável.
  evidencia:
    - "Autor (13/08): 'as planilhas foram feitas para testar o sistema, erros calculados, cenários caóticos; nunca fiz um teste de escala'"
    - "Sete famílias estatísticas no arsenal, nenhuma observada em regime"
  formulas_expostas:
    - "FOR-TMI-001 · FOR-SEV-005 · FOR-SEV-009 — P75 (alvo de três índices do SEV)"
    - "FOR-BAS-003 — mediana do ciclo de recompra (north-star do Cockpit)"
    - "FOR-BAS-002 — quintis do RFM"
    - "FOR-MRG-012 — amplitude máx−mín (a mais sensível de todas a n pequeno)"
    - "FOR-AUD-003 — limiar de 2 desvios-padrão"
    - "FOR-MET-011 — Pace_max sustentado por 1 semana em 3 meses"
    - "FOR-EST-004 — corte de Pareto 80/15/5"
  impacto: >
    O motor sabe que essas fórmulas RODAM e que DETECTAM. Não sabe se o P75 oscila mês a mês,
    se o 2σ dispara aleatoriamente com amostra pequena, ou se a amplitude da dispersão salta
    com uma venda atípica. As duas lacunas críticas mais recentes — LAC-FOR-015 (projeção
    linear) e LAC-NUM-089 (mínimo de amostra) — são as duas de estabilidade. Não é
    coincidência: é a classe que o teste atual estruturalmente não alcança.
  correcao_candidata: >
    Terceiro tipo de teste na base volumétrica: rodar cada estatística em janelas móveis ao
    longo dos 36 meses e medir a OSCILAÇÃO, não o valor. Critério de aceite por estabilidade
    (ex.: coeficiente de variação do P75 entre meses consecutivos abaixo de um teto), não só
    por acerto contra gabarito.
  bloqueia: []
  quem_decide: Rodrigo
  status: ABERTA
  nota: >
    Isso não é crítica às fixtures — elas cumpriram o papel para o qual foram feitas. É a
    identificação de um teste que ainda não existe, e que a base volumétrica torna possível.

- id: LAC-NUM-091
  tipo: LAC
  severidade: ALTA
  fase: 1-CONSULTORIA
  titulo: "A fila de auditoria foi dimensionada contra fixture pequena — em escala vira backlog"
  descricao: >
    A SPEC_Fase_C estabelece o princípio dimensionador da fila de triagem: o humano recebe o
    RESÍDUO, nunca o atacado. Mas o limiar de entrada foi calibrado contra 3.044 linhas.
    Em volume realista, a mesma taxa produz uma fila que o próprio princípio condena.
  aritmetica:
    - "Consultoria.xlsx: 546 de 3.044 linhas disparam o trigger de discrepância = 17,9%"
    - "Base volumétrica (180.000 linhas), mesma taxa: ≈32.000 disparos"
    - "Mesmo com 99% de classificação automática pelo motor: ≈320 itens na fila humana"
    - "SPEC_Fase_C §1: 'uma fila com 300 itens é backlog morto; uma fila com 5 itens especificamente inexplicáveis é governança'"
  evidencia:
    - "SPEC_Fase_C §1 — princípio dimensionador declarado INEGOCIÁVEL"
    - "Autor (13/08): '95% dos erros resolvidos; nunca fiz teste de escala'"
  impacto: >
    O mecanismo criado para evitar backlog vira backlog. E o efeito é perverso: fila grande
    demais faz o consultor parar de olhar, e aí a triagem deixa de ser governança e passa a
    ser teatro — o item pendente continua não virando fato, mas também nunca é resolvido.
  correcao_candidata: >
    Antes da base volumétrica, decidir qual das duas alavancas: (a) subir a taxa de
    classificação automática (mais evidências cruzadas antes de escalar para humano); ou
    (b) estreitar o critério de entrada — por exemplo, priorizar por R$ em risco e mandar
    para a fila só o topo, deixando a cauda em relatório agregado.
    Recomendável declarar um TETO ABSOLUTO de itens por rodada, derivado do tempo humano
    disponível (a própria SPEC estima ~30s por item), e não da taxa de detecção.
  bloqueia: []
  quem_decide: Rodrigo
  status: ABERTA
  nota: >
    Não é bug e não é crítica ao desenho. É um limiar que nunca precisou ser testado porque o
    volume nunca chegou lá — e que a base volumétrica vai expor no primeiro run.

