  descricao: >
    Devoluções com qtd negativa, identidade cross-store (mesmo CPF com ids diferentes
    em duas lojas), linhas quebradas (data malformada, categoria vazia, venda_id duplicado)
    e outliers de digitação. O Gabarito cobra todos; nenhuma fórmula do acervo os menciona.
  evidencia:
    - "F11: 'C (sujo) · Devoluções — L6, qtd=-1 (6 linhas): estornos devem entrar líquidos'"
    - "F11: 'C (sujo) · Identidade cross-store — XS-01A (L4) e XS-01B (L7), mesmo CPF → deduplicar por CPF'"
    - "F11: 'C (sujo) · Linhas quebradas — L10: 1 data malformada, 1 categoria vazia, 1 venda_id duplicado → ingestão honesta'"
    - "F11: 'C (sujo) · Outlier de digitação — L9: preço R$33.900 e qtd=99'"
  impacto: "São regras de ingestão, não de cálculo — mas contaminam todo cálculo se ausentes."
  correcao_candidata: "Bloco REG de ingestão, separado das fórmulas."
  bloqueia: []
  quem_decide: Rodrigo
  status: ABERTA
