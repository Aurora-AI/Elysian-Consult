  bloco: SEV
  nome: "Índice de Captura — taxa crua"
  simbolo: IC_cru
  resumo: "Fração dos atendimentos que o vendedor cadastrou."
  expressao: "IC_cru = AC ÷ AT"
  variaveis:
    - {simbolo: AC, nome: "Atendimentos Cadastrados (com CPF/contato)", unidade: contagem, origem: fato_atendimento, natureza: CRUA}
    - {simbolo: AT, nome: "Atendimentos Totais", unidade: contagem, origem: fato_atendimento, natureza: CRUA}
  grao: vendedor
  janela: mensal
  natureza: CRUA
  onde: "Camada 1"
  quando: "Mensal"
  quem: "Máquina"
  entra: "eventos de atendimento e cadastro"
  sai: "insumo do FOR-SEV-003"
  casos_degenerados:
    - {condicao: "AT = 0", comportamento: "[LACUNA] não definido na fonte", lacuna: LAC-FOR-010}
    - {condicao: "AT não observável (loja Nível 0)", comportamento: "proxy declarado: Cadastros Novos ÷ Vendas Totais — vira razão, não taxa", ref: REG-SEV-001}
  procedencia:
    - {fonte: F1, local: "§1.1"}
    - {fonte: F2, local: "§1 · Índice de Captura"}
  status_canonico: CANONICO
  confianca: ALTA
  natureza_conhecimento: EMPIRICO_AUTOR
  lacunas: [LAC-FOR-006]

