pecas:

- id: FOR-SEV-001
  tipo: FOR
  bloco: SEV
  nome: "Normalização universal de índice"
  simbolo: IN
  resumo: "Converte a taxa crua de qualquer índice em 'quão perto do ideal', com teto."
  expressao: "IN = mín( Real ÷ Alvo ; 1 ) × 100"
  variaveis:
    - {simbolo: Real, nome: "taxa realizada do índice", unidade: razao, origem: derivada, natureza: CRUA}
    - {simbolo: Alvo, nome: "alvo derivado do dado", unidade: razao, origem: derivada, natureza: DERIVADA}
  grao: vendedor
  janela: mensal
  natureza: NORMALIZADA
  teto: 100
  piso: 0
  onde: "Camada 1 · todo índice do SEV"
  quando: "Mensal; alvos recalibram trimestral"
  quem: "Máquina"
  entra: "taxa crua + alvo derivado"
  sai: "índice 0–100 comparável entre parcelas"
  casos_degenerados:
    - {condicao: "Alvo = 0", comportamento: "[LACUNA] não definido na fonte", lacuna: LAC-FOR-010}
    - {condicao: "Real > Alvo", comportamento: "teto em 100 (definido)"}
  procedencia:
    - {fonte: F3, local: "§1", trecho: "IN = mín(Real ÷ Alvo ; 1) × 100"}
    - {fonte: F1, local: "§1.3"}
  status_canonico: CANONICO
  confianca: ALTA
  natureza_conhecimento: EMPIRICO_AUTOR
  ver_tambem: [FOR-SEV-003, FOR-SEV-005, FOR-SEV-009, FOR-SEV-011]
  implementado_em: null
  verificado_contra: null

