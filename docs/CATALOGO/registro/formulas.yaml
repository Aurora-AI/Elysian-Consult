      p: {IC: 0.45, IA: 0.15, IT: 0.10, IR: 0.20, IAd: 0.10}
      prioridade: "Encher a base — a loja está cega"
      fontes_concordantes: [F1, F2, F6]
    - estagio: Construção
      fases: "padrão"
