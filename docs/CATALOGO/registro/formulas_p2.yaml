    - {condicao: "cliente com uma só compra", comportamento: "não entra no cálculo (sem intervalo)"}
  procedencia:
    - {fonte: F6, local: "Parte A · A3 e Parte E · Cockpit"}
    - {fonte: F7, local: "Parte A · A3"}
  status_canonico: CANONICO
  confianca: ALTA
  natureza_conhecimento: EMPIRICO_AUTOR
  implementado_em: "src/product_b/oracle/commercial_auditor.py"

