  confianca: ALTA
  natureza_conhecimento: LITERATURA_PUBLICA
  implementado_em: "src/product_b/oracle/commercial_auditor.py"
  verificado_contra: "F11 · 'Campeões (RFM A2) — Clientes C-001..C-010: 10 clientes de alta recência/frequência/valor'"

