  janela: mensal
  natureza: DERIVADA
  meta_declarada: {de: "15+ meses", para: "< 12 meses", fonte: F6}
  onde: "Cockpit — indicador-mãe"
  quando: "Mensal"
  quem: "Máquina"
  entra: "intervalos de compra"
  sai: "meta de compressão + base do churn"
  casos_degenerados:
