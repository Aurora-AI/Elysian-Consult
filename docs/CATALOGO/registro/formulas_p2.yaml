- id: FOR-BAS-001
  tipo: FOR
  bloco: BAS
  nome: "Completude de Cadastro (A1)"
  simbolo: Compl
  resumo: "Pré-requisito de tudo: dá para rodar o motor?"
  expressao: "Compl_campo = ( registros com o campo ÷ total de registros ) × 100"
  variaveis:
    - {simbolo: "registros com o campo", nome: "cadastros com o campo preenchido", unidade: contagem, origem: dim_cliente, natureza: CRUA}
    - {simbolo: "total de registros", nome: "cadastros da loja", unidade: contagem, origem: dim_cliente, natureza: CRUA}
    - {simbolo: campo, nome: "telefone/WhatsApp · CPF · data de exame", unidade: categoria, origem: dim_cliente, natureza: CRUA}
  grao: loja_campo
  janela: diaria
  natureza: CRUA
  limiares:
    - {valor: 30, tipo: CONTINGENCIA, fonte: F6, acao: "abaixo de 30% com telefone/CPF, o choque do D5 pivota 100% para estoque (B4/B5)"}
    - {valor: 70, tipo: META_PARTIDA, fonte: F7, acao: "meta operacional de partida com telefone/WhatsApp"}
  onde: "Diagnóstico D1–D2, antes de rodar o resto"
  quando: "No início; depois contínuo"
  quem: "Consultor / EXRS"
  entra: "cadastro bruto"
  sai: "decide a contingência do diagnóstico"
  casos_degenerados:
    - {condicao: "total de registros = 0", comportamento: "[LACUNA]", lacuna: LAC-FOR-010}
    - {condicao: "dois limiares (30% e 70%) sem hierarquia declarada", comportamento: "[LACUNA]", lacuna: LAC-FOR-055}
  procedencia:
    - {fonte: F7, local: "Parte A · A1"}
    - {fonte: F6, local: "Parte A · A1"}
  status_canonico: CANONICO
  confianca: ALTA
  natureza_conhecimento: LITERATURA_PUBLICA
  implementado_em: "src/product_b/oracle/commercial_auditor.py"
  verificado_contra: "F11 · 'Contingência de dados (A1) — Aba Clientes: completude ~88% (telefone/CPF). >30% → motor roda normalmente'"

