  nome: "Executive Audit Report — o Laudo"
  resumo: "Prova ao dono que o relatório que ele olha hoje mente. Uma vez, no D5–D7."
  consumidor: dono
  gatilho: "diagnóstico concluído — o choque do Dia 5"
  cadencia: uma_vez_por_rodada
  superficie:
    teto_elementos: 1
    numero_ancora: "R$ total em risco, consolidado"
    elementos: ["um único número em R$, tipografia gigante, zero tabela, zero lista"]
    o_que_NAO_aparece:
      - "SKU, churn, attach, GMROI, margem de contribuição, LTV, dataset, outlier — vocabulário PROIBIDO (F12 §3.4)"
      - "qualquer métrica que responda 'quanto mede' em vez de 'quanto custa'"
      - "item pendente na fila de auditoria (F13) — pendente nunca vira fato"
      - "4º capítulo no Ato 3 — são exatamente 3, o resto vira sub-item ou anexo"
  profundidade:
    eixo_vertical: [rede, loja, categoria, sku, venda, item, linha_de_origem]
    eixo_horizontal:
      - {grao: loja, dimensoes: [natureza_item, categoria, periodo]}
      - {grao: cliente, dimensoes: [segmento_rfm, recuperabilidade]}
    completude: TOTAL
    piso_declarado: "ART-ANX-001 — o anexo É a soma; divergência de 1 centavo quebra o build"
  estrutura:
    - {ato: 1, nome: "O SOCO", conteudo: "1 tela, 10 segundos, um número"}
    - {ato: 2, nome: "O PARADOXO", conteudo: "o achado que prova que o relatório atual engana"}
    - {ato: 3, nome: "OS TRÊS SANGRAMENTOS", conteudo: "Lucro Fantasma · Clientes Evaporando · Caixa Preso"}
    - {ato: 4, nome: "A ABSOLVIÇÃO", conteudo: "o que NÃO é problema — sem venda nesta seção"}
    - {ato: 5, nome: "A SAÍDA", conteudo: "plano ordenado por R$ computado, nunca por dramaticidade"}
  lei_de_linguagem: LAUDO
  modo_minimo: a
  consome:
    superficie_e_direto: [FOR-BAS-004, FOR-BAS-005, FOR-BAS-008, FOR-EST-006, FOR-MRG-001, FOR-MRG-013, FOR-MRG-020]
    profundidade: [FOR-BAS-001, FOR-BAS-002, FOR-BAS-003, FOR-BAS-006, FOR-BAS-007, FOR-BAS-009, FOR-EST-001, FOR-EST-002, FOR-EST-003, FOR-EST-004, FOR-EST-005, FOR-EST-007, FOR-MRG-002, FOR-MRG-003, FOR-MRG-004, FOR-MRG-005, FOR-MRG-014, FOR-MRG-021, FOR-AUD-001, FOR-AUD-002, FOR-AUD-003, FOR-AUD-004, FOR-AUD-005, FOR-TMI-006]
  regras_aplicaveis: [REG-NUM-001, REG-NUM-004]
  procedencia: [{fonte: F12, local: "§0 a §4 — a LEI"}]
  status_canonico: CANONICO
  confianca: ALTA
  natureza_conhecimento: EMPIRICO_AUTOR
  nota: "É o artefato mais especificado do acervo — tem lei narrativa, lei de linguagem, lei visual e validador de zero contradição. Serve de padrão de rigor para os demais."

